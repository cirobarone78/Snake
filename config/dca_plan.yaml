# Piano di accumulo — configurazione.
#
# Questo file descrive il piano REALE dell'utente. Il core (BTC/ETH/NEAR) è
# fisso e non viene mai messo in discussione dal sistema: l'unica decisione
# ricorrente è su quale asset della quota satellite far cadere il versamento.
#
# `holdings_units` sono le quantità effettivamente possedute (non euro). Se
# lasciato vuoto, il sistema stima la posizione replicando il piano da
# `start_date` e lo dichiara esplicitamente nel report: è un'approssimazione,
# non un estratto conto. Compilarlo rende il calcolo dello scarto dal target
# esatto invece che stimato.

monthly_eur: 110
start_date: "2025-10-01"

# Allocazione fissa: nessuna scelta da fare, nessun modello coinvolto.
# NEAR aggiunto il 2026-08-28 su decisione dell'utente (ADR-037): quarta gamba
# fissa da 10€, scelta informata dallo screener fondamentale (ADR-031), che da
# ora lo esclude dalle candidate perché parte del piano.
core:
  BTC: 60
  ETH: 30
  NEAR: 10

# La quota su cui il sistema esprime una preferenza mensile.
sleeve:
  budget_eur: 10
  # Target interno alla quota satellite (somma normalizzata a 1).
  target_weights:
    SOL: 0.3334
    LINK: 0.3333
    POL: 0.3333

# Quantità realmente possedute, per asset — QUANTITÀ ESATTE lette dalle schede
# dell'exchange il 2026-08-24. Il sistema usa oggi solo la quota satellite
# (SOL/LINK/POL); BTC ed ETH sono registrate per completezza e per usi futuri.
holdings_units:
  BTC: 0.009951
  ETH: 0.13263
  NEAR: 0.0  # gamba aggiunta il 2026-08-28, primo acquisto non ancora eseguito
  SOL: 0.59501
  LINK: 4.10498
  POL: 159.3624

# Posizioni FUORI dal piano (quantità esatte dell'exchange, 2026-08-24),
# registrate per completezza: il sistema non le usa e non esprime preferenze.
# DOGE e PEPE sono meme coin senza meccanismo di cattura del valore (ADR-031);
# USDG è una stablecoin (liquidità di servizio).
off_plan_holdings:
  PEPE: 1922053
  DOGE: 22.49
  USDG: 6.25
