name: paper-shadow

# Fase 6 (ADR-010/011/029): advance the paper-trading scenarios by one daily
# bar. Orders decided today fill tomorrow (no look-ahead); the committed state
# in data/paper/ is the live-shadow track record — the phase deliverable. The
# run also refreshes public/data/paper_report.json (the dashboard payload) and
# public/data/paper_replay.json (backward-looking historical replay of the same
# strategy through the same broker). Commits data only (same anti-recursion
# note as news-history.yml).

on:
  schedule:
    # After the crypto daily close (00:00 UTC): 00:40, clear of the news cron.
    - cron: "40 0 * * *"
  workflow_dispatch: {}

concurrency:
  group: paper-shadow
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Advance paper scenarios
        run: uv run python -m src.execution.live_shadow

      - name: Refresh historical replay
        run: uv run python -m src.execution.replay

      - name: Commit paper state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/paper public/data/paper_report.json public/data/paper_replay.json
          if git diff --cached --quiet; then
            echo "No paper-state changes to commit."
            exit 0
          fi
          git commit -m "data: advance paper-trading scenarios"
          git push
