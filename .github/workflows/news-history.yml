name: news-history

# Fase 3 / ADR-025: accumulate a compact, versioned news history so lead/lag
# studies have months of data despite feeds only exposing the last few weeks.
# Commits data only. The bot pushes with GITHUB_TOKEN, which does not re-trigger
# our CI (GitHub anti-recursion), and Cloudflare redeploys the fresh data — so no
# CI-skip token is used (one would also stop the Cloudflare build).

on:
  schedule:
    # Every 3h so the dashboard "Eventi" stay fresh (public repo -> Actions free).
    # C1 of the Fase 7 backlog (ADR-028 follow-up): was every 6h.
    - cron: "30 */3 * * *" # 00:30 / 03:30 / ... / 21:30 UTC
  workflow_dispatch: {}

# Avoid overlapping runs piling commits on the same file.
concurrency:
  group: news-history
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Update news history
        run: uv run python -m src.ingestion.news.update_history

      - name: Build events (move attribution for the dashboard)
        run: uv run python -m src.ingestion.tier1.build_events

      # ADR-033: the history is partitioned by publication month, so a run only
      # rewrites the partition(s) it actually touched — normally just the current
      # month. Staging by changed file (not by "today's month") is deliberate: a
      # run on the 1st still lands late items in the previous month's partition,
      # and a feed occasionally surfaces an old article. Past months stay
      # byte-identical and git never stores them again.
      - name: Commit updated history + events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          PATHS="data/news_history public/data/events.json"
          if git diff --quiet -- $PATHS && [ -z "$(git ls-files --others --exclude-standard -- $PATHS)" ]; then
            echo "No news/events changes to commit."
            exit 0
          fi
          echo "Partitions rewritten this run:"
          git status --porcelain -- data/news_history
          git add $PATHS
          git commit -m "data: update news history + events"
          git push
