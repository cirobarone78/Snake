name: sector-history

# Fase 8: accumulate a daily snapshot of equity sector/theme ETF momentum, so
# the rotation history grows (the equity analogue of category-history). Commits
# data + REPORT_EQUITY.md. The bot's GITHUB_TOKEN push does not re-trigger our CI
# (GitHub anti-recursion), and Cloudflare redeploys — so no CI-skip token is used.

on:
  schedule:
    - cron: "30 7 * * 1-5" # 07:30 UTC, weekdays only (equity markets closed weekends)
  workflow_dispatch: {}

concurrency:
  group: sector-history
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Update sector history
        run: uv run python -m src.ingestion.tier1.fetch_sectors

      - name: Commit updated history + report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/sector_history REPORT_EQUITY.md public/data/equity_report.json; then
            echo "No sector changes to commit."
            exit 0
          fi
          git add data/sector_history REPORT_EQUITY.md public/data/equity_report.json
          git commit -m "data: update sector history + report"
          git push
